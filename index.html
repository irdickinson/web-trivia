<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#241b22" />

    <title>Web Trivia — Free Multiplayer Trivia Game</title>
    <meta name="description" content="Free multiplayer trivia game. Create a room, share the code, and challenge your friends across History, Science, Geography, Pop Culture, and more." />
    <meta name="robots" content="index, follow" />

    <!-- Fonts: Fraunces — elegant high-contrast serif used site-wide -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon & manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Web Trivia" />
    <meta property="og:title" content="Web Trivia — Free Multiplayer Trivia Game" />
    <meta property="og:description" content="Free multiplayer trivia game. Create a room, share the code, and challenge your friends across History, Science, Geography, Pop Culture, and more." />
    <meta property="og:url" content="https://web-trivia.web.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Web Trivia — Free Multiplayer Trivia Game" />
    <meta name="twitter:description" content="Free multiplayer trivia game. Create a room, share the code, and challenge your friends across History, Science, Geography, Pop Culture, and more." />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Web Trivia",
      "url": "https://web-trivia.web.app/",
      "description": "Free multiplayer trivia game. Create a room, share the code, and challenge your friends.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
